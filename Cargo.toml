[package]
name = "bksync"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
aws-sdk-s3 = "1"
aws-config = "1"
aws-runtime = "1"
aws-smithy-runtime-api = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
walkdir = "2"
globset = "0.4"
chrono = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
md-5 = "0.10"
filetime = "0.2"
serde_json = "1"
dirs = "6"
indicatif = "0.17"
notify = "7"