[profile.default]
endpoint = "https://rustfs.example.com"
region = "us-east-1"
bucket = "my-bucket"
access_key = "YOUR_ACCESS_KEY"
secret_key = "YOUR_SECRET_KEY"
local_dir = "/home/user/s3sync"
include = ["**/*"]
exclude = [".DS_Store", "*.tmp", "*.log", ".git/"]

